<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DEBUG patches-fix smoke test</title>
  <link rel="stylesheet" href="styles.css?v=101">
  <script>
    window.__debugErrors = [];
    window.addEventListener('error', e => { window.__debugErrors.push({ msg: e.message, src: (e.filename||'').slice(-60), line: e.lineno }); });
    window.addEventListener('unhandledrejection', e => { window.__debugErrors.push({ reason: String(e.reason).slice(0, 300) }); });
  </script>
  <style>
    .welcome-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; z-index: 10010; }
    .welcome-modal-overlay.hidden { display: none; }
    .welcome-modal-card { background: #1a1a2a; border: 1px solid rgba(200, 160, 74, 0.3); border-radius: 12px; padding: 28px 32px; max-width: 540px; width: 92%; max-height: calc(100dvh - 32px); overflow-y: auto; }
    .welcome-modal-btn { padding: 10px 20px; min-height: 44px; cursor: pointer; }
    .debug-banner { position: fixed; bottom: 0; left: 0; right: 0; background: #ff8c30; color: #fff; padding: 4px 8px; z-index: 99999; font-size: 11px; font-family: monospace; text-align: center; }
  </style>
</head>
<body>
  <div class="debug-banner">DEBUG: patches-FIX smoke test — separate from production index.html</div>
  <div class="container">
    <div class="header"><div class="logo-container"><img src="lemon-logo.png" alt="" onerror="this.style.display='none'"><div class="logo">Undercover <span>Zest</span></div></div></div>
    <div class="key-selector" id="keySelector">
      <button class="key-collapser" id="keyCollapser" data-action="toggleKeyExpander"><span class="key-label">KEY</span><span class="key-collapser-current" id="keyCollapserCurrent">C</span><span class="key-collapser-arrow">&#9662;</span></button>
      <div id="keyButtons" class="key-buttons-row"></div>
    </div>
    <div class="controls-bar">
      <div class="controls-left">
        <button class="tab-collapser" id="tabCollapser" data-action="toggleTabExpander"><span class="tab-collapser-current" id="tabCollapserCurrent">Bright Chords (Major)</span><span class="tab-collapser-arrow">&#9662;</span></button>
        <div id="tabButtons" class="tab-buttons"></div>
      </div>
      <div class="controls-right">
        <button class="tool-toggle-btn" id="toolMenuToggle" data-action="toggleToolMenu">Tools</button>
        <div class="tool-buttons" id="toolButtons">
          <button class="playback-btn" id="btnPlayback" data-action="openPlaybackPanel">Playback</button>
          <button class="file-btn-tool" id="btnFile" data-action="openFilePanel">File</button>
          <button class="keyfinder-btn" id="btnKeyFinder" data-action="openKeyFinder">Key Finder</button>
          <button class="fretboard-btn" id="btnShowScale" data-action="toggleFretboard">Show Scale</button>
          <button class="arpeggiator-btn" id="btnArpeggiator" data-action="toggleArpeggiator">Arpeggiator</button>
          <button class="chordpicker-btn" id="btnChordPicker" data-action="openChordPicker">Chord Picker</button>
          <button class="tuner-btn" id="btnTuner" data-action="toggleTuner">Tuner</button>
          <button class="tutorial-btn" id="btnTutorial" data-action="openTutorial">Tutorial</button>
        </div>
      </div>
    </div>
    <div class="progression-builder"><div class="progression-area" id="progressionArea"><span class="progression-empty">Click chords to build a progression...</span></div></div>
    <div class="main-content">
      <div class="chord-section">
        <div class="chord-grid" id="chordGrid"></div>
        <div id="fretboardContainer" class="fretboard-container hidden"></div>
        <div id="arpeggiatorContainer" class="arpeggiator-container hidden"></div>
        <div id="tunerContainer" class="tuner-container hidden"></div>
      </div>
      <div class="detail-section">
        <div class="chord-detail-panel always-visible" id="chordDetailPanel">
          <div class="chord-detail-header"><span class="chord-detail-title" id="chordDetailTitle">Select a chord</span><button class="chord-detail-close" data-action="closeAnalysis">&times;</button></div>
          <div id="chordTheoryContext" class="theory-context"></div>
          <div class="chord-variations" id="chordVariations"></div>
          <div id="chordDiagrams" class="chord-diagrams"></div>
          <button class="oolimo-btn" data-action="openOolimo">Open Extended Chords (Oolimo)</button>
        </div>
      </div>
    </div>
    <div id="scalePopup" class="scale-popup hidden"><div class="scale-popup-content"><button class="close-btn" data-action="toggleScalePopup">&times;</button><div id="scaleContent"></div></div></div>
    <div id="chordPickerPopup" class="chord-picker-popup hidden"><div class="chord-picker-content"><div class="chord-picker-header"><span class="chord-picker-title">Chord Picker</span><button class="popout-btn" data-action="popoutPanel" data-panel="chordPicker">&#9192;</button><button class="chord-picker-close" data-action="closeChordPicker">&times;</button></div><div class="root-note-grid" id="rootNoteGrid"></div><div class="quality-grid"><div class="quality-col"><div class="quality-col-label">Type</div><button class="quality-btn active" data-quality="">Major</button><button class="quality-btn" data-quality="m">Minor</button><button class="quality-btn" data-quality="sus2">Sus2</button><button class="quality-btn" data-quality="sus4">Sus4</button><button class="quality-btn" data-quality="dim">Dim</button><button class="quality-btn" data-quality="aug">Aug</button></div><div class="quality-col"><div class="quality-col-label">Extensions</div><button class="quality-btn" data-ext="">Basic</button><button class="quality-btn" data-ext="6">6</button><button class="quality-btn" data-ext="7">7</button><button class="quality-btn" data-ext="maj7">maj7</button><button class="quality-btn" data-ext="add9">add9</button><button class="quality-btn" data-ext="9">9</button></div></div><div class="chord-picker-result"><div class="result-chord-name" id="pickerResultChord">C</div><button class="add-to-progression-btn" data-action="addPickedChord">Add to Progression</button><button class="add-to-progression-btn" data-action="playPickedChord">&#9654; Play</button></div></div></div>
    <div id="playbackPopup" class="playback-popup hidden"><div class="playback-content"><div class="playback-header"><span class="playback-title">Playback</span><button class="playback-close" data-action="closePlaybackPanel">&times;</button></div><div id="playbackBody" class="playback-body"></div></div></div>
    <div id="filePopup" class="file-popup hidden"><div class="file-content"><div class="file-header"><span class="file-title">File</span><button class="file-close" data-action="closeFilePanel">&times;</button></div><div id="fileBody" class="file-body"></div></div></div>
    <div id="keyFinderPopup" class="key-finder-popup hidden"><div class="key-finder-content"><div class="key-finder-header"><span class="key-finder-title">Key Finder</span><button class="popout-btn" data-action="popoutPanel" data-panel="keyFinder">&#9192;</button><button class="key-finder-close" data-action="closeKeyFinder">&times;</button></div><div class="kf-root-grid" id="kfRootGrid"></div><div class="kf-quality-row"><button class="kf-quality-btn active" data-kf-quality="">Maj</button><button class="kf-quality-btn" data-kf-quality="m">min</button><button class="kf-quality-btn" data-kf-quality="7">7</button><button class="kf-quality-btn" data-kf-quality="m7">m7</button><button class="kf-quality-btn" data-kf-quality="maj7">maj7</button><button class="kf-quality-btn" data-kf-quality="dim">dim</button><button class="kf-quality-btn" data-kf-quality="sus4">sus4</button></div><div class="kf-add-row"><span class="kf-preview" id="kfPreview">C</span><button class="kf-add-btn" data-action="kfAddChord">+ Add</button></div><div class="kf-progression" id="kfProgression"><span class="kf-empty">Add chords above...</span></div><div class="kf-result" id="kfResult"><div class="kf-result-label">Possible Keys:</div><div class="kf-result-keys" id="kfResultKeys">-</div></div><div class="kf-actions"><button class="kf-clear-btn" data-action="kfClear">Clear</button><button class="kf-use-btn" data-action="kfUseKey">Use This Key</button></div></div></div>
  </div>
  <div id="welcomeModal" class="welcome-modal-overlay hidden"><div class="welcome-modal-card"><h2>Debug mode</h2><button class="welcome-modal-btn" id="welcomeGotIt">Got it</button><button class="welcome-modal-btn" id="welcomeLearnMore">Learn more</button></div></div>
  <div class="lyrics-panel-tab" id="lyricsPanelTab">&#9835; Lyrics</div>
  <div class="lyrics-panel" id="lyricsPanel"><div class="lp-header"><span class="lp-title">&#9835; RhymeForge</span></div><div class="lp-tabs"><button class="lp-tab active" data-lp-tab="lyrics">Lyrics</button><button class="lp-tab" data-lp-tab="rhymes">Rhymes</button><div class="lp-tabs-controls"><button class="lp-size-btn" data-lp-size="quarter">&frac14;</button><button class="lp-size-btn" data-lp-size="third">&#8531;</button><button class="lp-size-btn active" data-lp-size="half">&frac12;</button><button class="lp-close-btn" id="lyricsPanelClose">&times;</button></div></div><div class="lp-body" id="lpBody"></div></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module" src="app.js?v=101"></script>
  <script src="uz-nav.js"></script>
  <script src="uz-footer.js?v=13"></script>
  <script src="uz-deferred-patches-fix.js"></script>
</body>
</html>
